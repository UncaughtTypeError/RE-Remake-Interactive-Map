<div
    class="list-group keymenu list-group-expand biohazards keymenu-inactive"
    data-id="biohazards-list"
>
    <div class="list-group-actions">
        <div class="list-group-tab-wrapper">
            <span class="list-group-tab toggle-state"
                ><i class="fa fa-dot-circle-o toggle-group-tab"></i> Biohazards</span
            >
            <span class="list-group-tab"
                ><i class="fa fa-circle-o toggle-group-tab"></i> Rooms</span
            >
        </div>
        <div class="icon-trigger toggle-state">
            <i class="fa fa-caret-right keymenu-toggle-trigger"></i>
        </div>
    </div>
    <div class="list-group-actions">
        <div class="stars-ranking-rating">S.T.A.R.S.<br /><span>Ranking</span></div>
        <div class="stars-ranking-group">
            <i class="fa fa-caret-down ranking-dropdown-select dropdown-inactive"></i>
            <div class="stars-ranking-dropdown">
                <!-- Default "All" option -->
                <div
                    class="stars-ranking-type ranking-type-active ranking-dropdown-item"
                    data-hazard="default-biohazards"
                    data-ranking="default"
                >
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                </div>
                <!-- S.T.A.R.S. rankings will be dynamically generated by rankingsRenderer -->
                <div class="dropdown-menu"></div>
            </div>
            <div class="stars-ranking-display">
                <!-- S.T.A.R.S. rankings display will be dynamically generated by rankingsRenderer -->
            </div>
            <div class="ranking-select-wrapper">
                <i class="fa fa-caret-up ranking-increment ranking-select"></i>
                <i class="fa fa-caret-down ranking-decrement ranking-select"></i>
            </div>
        </div>
        <div class="icon-trigger trigger-info" id="ranking-info">
            <i class="fa fa-question"></i>
            <div class="icon-trigger-tooltip">
                <span>Fetch S.T.A.R.S. Ranking Reference</span>
            </div>
        </div>
        <div class="icon-trigger trigger-info biohazard-info" id="biohazard-info">
            <i class="fa fa-info"></i>
            <div class="icon-trigger-tooltip">
                <span>Fetch Biohazards Case Studies</span>
            </div>
        </div>
        <div class="icon-trigger trigger-info" id="biohazard-Array">
            <i class="fa fa-th"></i>
            <div class="icon-trigger-tooltip">
                <span>Fetch Biohazards Array</span>
            </div>
        </div>
        <div class="icon-trigger trigger-keys" id="biohazard-toggle-keys">
            <i class="fa keys-inactive fa-circle-o"></i>
        </div>
    </div>
    <div class="list-group-wrapper list-group-tab-content toggle-state" id="tab-list">
        <!-- Biohazards list content will be dynamically generated by biohazardsListRenderer -->
        <div class="list-group-container"></div>
    </div>
    <div class="list-group-wrapper list-group-tab-content" id="tab-rooms"></div>
</div>
