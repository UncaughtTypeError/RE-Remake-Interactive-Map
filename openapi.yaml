openapi: 3.0.0
info:
    title: RE Remake Interactive Map API
    description: |
        RESTful API for querying Resident Evil Remake game data including items, biohazards, maps, areas, and rooms.

        All endpoints support filtering by various parameters and include rate limiting (100 requests per 15 minutes).

        ## Features
        - Query resources by IDs with batch support
        - Search and filter by multiple criteria
        - S.T.A.R.S. biohazard rankings
        - Comprehensive room and map data

        ## Rate Limiting
        All endpoints are rate-limited to 100 requests per 15-minute window. Rate limit information is provided in response headers.
    version: 1.0.0
    contact:
        name: RE Remake Interactive Map
        url: https://github.com/UncaughtTypeError/RE-Remake-Interactive-Map

servers:
    - url: http://localhost:3000
      description: Local development server
    - url: https://your-production-url.com
      description: Production server

tags:
    - name: Items
      description: Item-related endpoints for querying weapons, herbs, documents, and other collectibles
    - name: Persons
      description: Person-related endpoints for querying S.T.A.R.S. team members and characters
    - name: Biohazards
      description: Biohazard (enemy) endpoints including S.T.A.R.S. threat rankings
    - name: Maps
      description: Map, area, and room data endpoints

paths:
    # ============================================================================
    # ITEMS ENDPOINTS
    # ============================================================================
    /api/items/all:
        get:
            tags: [Items]
            summary: Get all items (base data)
            description: Retrieves all items base data without any filters. Returns the complete item database with master item definitions.
            responses:
                '200':
                    description: Successful response with all base items
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ItemData'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/items:
        get:
            tags: [Items]
            summary: Get items by IDs (base data)
            description: |
                Retrieves base item definitions by their unique type IDs. Supports comma-separated batch queries (max 100 IDs).
                Returns both found items and any unrecognized IDs. This returns master item definitions, not room-specific instances.
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'typewriter,itemBox,kerosene'
                  description: Comma-separated list of item IDs (e.g., 'typewriter,itemBox,handgun,batteryPack'). Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found base items and unrecognized IDs
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundItems:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ItemData'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                                        description: IDs that were not found in the database
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/items/search:
        get:
            tags: [Items]
            summary: Search and filter items (base data)
            description: |
                Search base items by type or name. Returns master item definitions without room locations or difficulty information.
                All parameters are optional and can be combined. Returns items matching ALL specified criteria (AND logic).
            parameters:
                - name: type
                  in: query
                  schema:
                      type: string
                      enum:
                          [
                              Typewriter,
                              ItemBox,
                              Kerosene,
                              Map,
                              PersonOfInterest,
                              DoorKey,
                              InkRibbon,
                              ItemOfInterest,
                              Document,
                              GreenHerb,
                              RedHerb,
                              BlueHerb,
                              FirstAidSpray,
                              SelfDefense,
                              Ammunition,
                              Weapon,
                          ]
                      example: 'Weapon'
                  description: Filter by item type
                - name: name
                  in: query
                  schema:
                      type: string
                      example: 'Handgun'
                  description: Filter by item name (partial match, case-insensitive)
            responses:
                '200':
                    description: Successful response with filtered base items
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ItemData'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/items/rooms/all:
        get:
            tags: [Items]
            summary: Get all items (room data)
            description: |
                Retrieves all items with complete room location data, including map IDs, room IDs, and difficulty availability.
                Optionally filter by difficulty level to see which items are available on that difficulty.
            parameters:
                - name: difficulty
                  in: query
                  schema:
                      type: string
                      enum:
                          [
                              JV-lvl-very-easy,
                              JV-lvl-easy,
                              JV-lvl-normal,
                              JV-lvl-hard,
                              CR-lvl-very-easy,
                              CR-lvl-easy,
                              CR-lvl-normal,
                              CR-lvl-hard,
                          ]
                      example: 'JV-lvl-normal'
                  description: Optional - Filter items by difficulty level to see availability
            responses:
                '200':
                    description: Successful response with all room items
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ItemRoomData'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/items/rooms:
        get:
            tags: [Items]
            summary: Get items by IDs (room data)
            description: |
                Retrieves items by their unique IDs with complete room location data. Supports comma-separated batch queries (max 100 IDs).
                Returns both found items and any unrecognized IDs. This returns room-specific instances with location and difficulty information.
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'selfDefenseJV-keepersRoom,document-keepersRoom'
                  description: Comma-separated list of item instance IDs (format - itemType-roomId). Max 100 IDs.
                - name: difficulty
                  in: query
                  schema:
                      type: string
                      enum:
                          [
                              JV-lvl-very-easy,
                              JV-lvl-easy,
                              JV-lvl-normal,
                              JV-lvl-hard,
                              CR-lvl-very-easy,
                              CR-lvl-easy,
                              CR-lvl-normal,
                              CR-lvl-hard,
                          ]
                      example: 'JV-lvl-normal'
                  description: Optional - Filter by difficulty level to check availability
            responses:
                '200':
                    description: Successful response with found room items and unrecognized IDs
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundItems:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ItemRoomData'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                                        description: IDs that were not found in the database
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/items/rooms/search:
        get:
            tags: [Items]
            summary: Search and filter items (room data)
            description: |
                Search items with complete room location data by room, difficulty level, type, or name. All parameters are optional and can be combined.
                Returns items matching ALL specified criteria (AND logic). Includes room IDs, map IDs, and difficulty availability.
            parameters:
                - name: room
                  in: query
                  schema:
                      type: string
                      example: 'keepersRoom'
                  description: Filter by room ID (e.g., 'keepersRoom', 'diningRoomF1', 'mainHallF1')
                - name: difficulty
                  in: query
                  schema:
                      type: string
                      enum:
                          [
                              JV-lvl-very-easy,
                              JV-lvl-easy,
                              JV-lvl-normal,
                              JV-lvl-hard,
                              CR-lvl-very-easy,
                              CR-lvl-easy,
                              CR-lvl-normal,
                              CR-lvl-hard,
                          ]
                      example: 'JV-lvl-normal'
                  description: Filter by difficulty level (character and difficulty)
                - name: type
                  in: query
                  schema:
                      type: string
                      enum:
                          [
                              Typewriter,
                              ItemBox,
                              Kerosene,
                              Map,
                              PersonOfInterest,
                              DoorKey,
                              InkRibbon,
                              ItemOfInterest,
                              Document,
                              GreenHerb,
                              RedHerb,
                              BlueHerb,
                              FirstAidSpray,
                              SelfDefense,
                              Ammunition,
                              Weapon,
                          ]
                      example: 'SelfDefense'
                  description: Filter by item type
                - name: name
                  in: query
                  schema:
                      type: string
                      example: 'Battery Pack'
                  description: Filter by item name (partial match, case-insensitive)
            responses:
                '200':
                    description: Successful response with filtered room items
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ItemRoomData'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    # ============================================================================
    # PERSONS ENDPOINTS
    # ============================================================================
    /api/persons/all:
        get:
            tags: [Persons]
            summary: Get all persons (base data)
            description: Retrieves all person data without any filters. Returns the complete person database with character information including S.T.A.R.S. team members.
            responses:
                '200':
                    description: Successful response with all persons
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PersonData'
                            example:
                                - id: 'jillValentine'
                                  name: 'Jill Valentine'
                                  type: 'PersonOfInterest'
                                  taxonomy: 'Persons'
                                  imageSrc: 'https://placeholder-image-url.jpg'
                                  bio: 'to be added'
                                  exclusive: null
                                - id: 'barryBurton'
                                  name: 'Barry Burton'
                                  type: 'PersonOfInterest'
                                  taxonomy: 'Persons'
                                  imageSrc: 'https://placeholder-image-url.jpg'
                                  bio: 'to be added'
                                  exclusive: 'JV'
                                - id: 'albertWesker'
                                  name: 'Albert Wesker'
                                  type: 'PersonOfInterest'
                                  taxonomy: 'Persons'
                                  imageSrc: 'https://placeholder-image-url.jpg'
                                  bio: 'to be added'
                                  exclusive: null
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/persons:
        get:
            tags: [Persons]
            summary: Get persons by IDs (base data)
            description: |
                Retrieves person definitions by their unique PersonID values. Supports comma-separated batch queries (max 100 IDs).
                Returns both found persons and any unrecognized IDs. This returns person data for S.T.A.R.S. team members and characters.
            parameters:
                - name: ids
                  in: query
                  required: true
                  schema:
                      type: string
                      example: 'jillValentine,barryBurton'
                  description: Comma-separated list of PersonID values (e.g., 'jillValentine,barryBurton,albertWesker'). Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found persons and unrecognized IDs
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundPersons:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/PersonData'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                                        description: IDs that were not found in the database
                            example:
                                foundPersons:
                                    - id: 'jillValentine'
                                      name: 'Jill Valentine'
                                      type: 'PersonOfInterest'
                                      taxonomy: 'Persons'
                                      imageSrc: 'https://placeholder-image-url.jpg'
                                      bio: 'to be added'
                                      exclusive: null
                                    - id: 'barryBurton'
                                      name: 'Barry Burton'
                                      type: 'PersonOfInterest'
                                      taxonomy: 'Persons'
                                      imageSrc: 'https://placeholder-image-url.jpg'
                                      bio: 'to be added'
                                      exclusive: 'JV'
                                unrecognizedIds: ['unknownPerson']
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    # ============================================================================
    # BIOHAZARDS ENDPOINTS
    # ============================================================================
    /api/biohazards/all:
        get:
            tags: [Biohazards]
            summary: Get all biohazards (base data)
            description: |
                Retrieves all biohazards (enemies) base data without any filters. Returns the complete biohazard database with master biohazard definitions including names, types, and S.T.A.R.S. codes.
            responses:
                '200':
                    description: Successful response with all base biohazards
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/BiohazardData'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/biohazards:
        get:
            tags: [Biohazards]
            summary: Get biohazards by IDs (base data)
            description: |
                Retrieves base biohazard definitions by their unique BiohazardCode IDs. Supports comma-separated batch queries (max 100 IDs).
                Returns both found biohazards and any unrecognized IDs. This returns master biohazard definitions, not room-specific instances.
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'Zb,Ht,Cb'
                  description: Comma-separated list of BiohazardCode IDs (e.g., 'Zb' for Zombie, 'Ht' for Hunter, 'Cb' for Cerberus, 'Ad' for Adder). Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found base biohazards and unrecognized IDs
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundBiohazards:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/BiohazardData'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/biohazards/stars-rankings:
        get:
            tags: [Biohazards]
            summary: Get S.T.A.R.S. threat rankings
            description: |
                Retrieves S.T.A.R.S. (Statistical Threat Analysis Rating Standard) threat rankings for biohazards.
                Returns official threat assessment data including ranking, ranking classification, threat level and engagement directive.
            parameters:
                - name: codes
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'Zb,Cr'
                  description: Comma-separated list of S.T.A.R.S. codes (e.g., 'Zb' for Zombie, 'Cr' for Crow). Max 100 codes.
            responses:
                '200':
                    description: Successful response with S.T.A.R.S. rankings
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundRankings:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/STARSRanking'
                                    unrecognizedCodes:
                                        type: array
                                        items:
                                            type: string
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/biohazards/search:
        get:
            tags: [Biohazards]
            summary: Search and filter biohazards (base data)
            description: |
                Search base biohazards by S.T.A.R.S. code or name. Returns master biohazard definitions without room locations or complete S.T.A.R.S. intelligence.
                All parameters are optional and can be combined. Returns biohazards matching ALL specified criteria (AND logic).
            parameters:
                - name: code
                  in: query
                  schema:
                      type: string
                      example: 'Zb'
                  description: Filter by S.T.A.R.S. code (e.g., 'Zb' for Zombie)
                - name: name
                  in: query
                  schema:
                      type: string
                      example: 'Zombie'
                  description: Filter by biohazard name (partial match, case-insensitive)
            responses:
                '200':
                    description: Successful response with filtered base biohazards
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/BiohazardData'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/biohazards/rooms/all:
        get:
            tags: [Biohazards]
            summary: Get all biohazards (room data)
            description: |
                Retrieves all biohazards with complete room location data and S.T.A.R.S. (Statistical Threat Analysis Rating Standard) intelligence.
                Includes threat classifications (low-severe), Greek rankings (Eta-Alpha), star ratings (1-3), engagement directives,
                authorized response procedures, effective measures (weapon damage/shot counts), threat profiles, behavioral patterns,
                and caution advisories for field operatives.
            responses:
                '200':
                    description: Successful response with all room biohazards
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/BiohazardRoomData'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/biohazards/rooms:
        get:
            tags: [Biohazards]
            summary: Get biohazards by IDs (room data)
            description: |
                Retrieves biohazards by their unique IDs with complete room location data and S.T.A.R.S. intelligence. Supports comma-separated batch queries (max 100 IDs).
                Returns both found biohazards and any unrecognized IDs. This returns room-specific instances with location data and complete S.T.A.R.S. (Statistical Threat Analysis Rating Standard) classifications.
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'zombie1-keepersRoom,zombie2-keepersRoom'
                  description: Comma-separated list of biohazard instance IDs (format - biohazardType-roomId). Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found room biohazards and unrecognized IDs
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundBiohazards:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/BiohazardRoomData'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                                        description: IDs that were not found in the database
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/biohazards/rooms/search:
        get:
            tags: [Biohazards]
            summary: Search and filter biohazards (room data)
            description: |
                Search biohazards with complete room location data by room, difficulty level, S.T.A.R.S. code, or name. All parameters are optional.
                Returns biohazards matching ALL specified criteria (AND logic). Includes complete S.T.A.R.S. (Statistical Threat Analysis Rating Standard) intelligence:
                threat classifications (low-severe), Greek rankings (Eta-Alpha), star ratings (1-3), engagement directives, authorized response procedures,
                effective measures (weapon damage/shot counts), threat profiles, behavioral patterns, and caution advisories for field operatives.
            parameters:
                - name: room
                  in: query
                  schema:
                      type: string
                      example: 'keepersRoom'
                  description: Filter by room ID (e.g., 'keepersRoom', 'teaRoomCorridor', 'mainHallF1')
                - name: difficulty
                  in: query
                  schema:
                      type: string
                      enum:
                          [
                              JV-lvl-very-easy,
                              JV-lvl-easy,
                              JV-lvl-normal,
                              JV-lvl-hard,
                              CR-lvl-very-easy,
                              CR-lvl-easy,
                              CR-lvl-normal,
                              CR-lvl-hard,
                          ]
                      example: 'JV-lvl-normal'
                  description: Filter by difficulty level
                - name: code
                  in: query
                  schema:
                      type: string
                      example: 'Zb'
                  description: Filter by S.T.A.R.S. BiohazardCode (e.g., 'Zb' for Zombie, 'Ht' for Hunter, 'Cb' for Cerberus, 'Ad' for Adder)
                - name: name
                  in: query
                  schema:
                      type: string
                      example: 'Zombie'
                  description: Filter by biohazard name (partial match, case-insensitive)
            responses:
                '200':
                    description: Successful response with filtered room biohazards
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/BiohazardRoomData'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    # ============================================================================
    # MAPS ENDPOINTS - AREAS
    # ============================================================================
    /api/maps/areas/all:
        get:
            tags: [Maps]
            summary: Get all areas
            description: Retrieves all game areas (e.g., Mansion, Guardhouse, Laboratory).
            responses:
                '200':
                    description: Successful response with all areas
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Area'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/maps/areas:
        get:
            tags: [Maps]
            summary: Get areas by IDs
            description: |
                Retrieves areas by their unique IDs. Supports comma-separated batch queries (max 100 IDs).
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'mansion,guardhouse,laboratory'
                  description: Comma-separated list of area IDs. Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found areas
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundAreas:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Area'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    # ============================================================================
    # MAPS ENDPOINTS - MAPS
    # ============================================================================
    /api/maps/maps/all:
        get:
            tags: [Maps]
            summary: Get all maps
            description: Retrieves all maps (floors within areas, e.g., Mansion 1F, Mansion 2F).
            responses:
                '200':
                    description: Successful response with all maps
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Map'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/maps/maps:
        get:
            tags: [Maps]
            summary: Get maps by IDs
            description: |
                Retrieves maps by their unique IDs. Supports comma-separated batch queries (max 100 IDs).
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'mansionF1,mansionF2,guardhouseF1'
                  description: Comma-separated list of map IDs. Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found maps
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundMaps:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Map'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    # ============================================================================
    # MAPS ENDPOINTS - ROOMS
    # ============================================================================
    /api/maps/rooms/all:
        get:
            tags: [Maps]
            summary: Get all rooms
            description: Retrieves all rooms with complete details including items, biohazards, and connections.
            responses:
                '200':
                    description: Successful response with all rooms
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Room'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/maps/rooms:
        get:
            tags: [Maps]
            summary: Get rooms by IDs
            description: |
                Retrieves rooms by their unique IDs. Supports comma-separated batch queries (max 100 IDs).
            parameters:
                - name: ids
                  in: query
                  required: false
                  schema:
                      type: string
                      example: 'keepersRoom,diningRoomF1,mainHallF1'
                  description: Comma-separated list of room IDs. Max 100 IDs.
            responses:
                '200':
                    description: Successful response with found rooms
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    foundRooms:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Room'
                                    unrecognizedIds:
                                        type: array
                                        items:
                                            type: string
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

    /api/maps/rooms/search:
        get:
            tags: [Maps]
            summary: Search and filter rooms
            description: |
                Search rooms by map, items, biohazards, persons, interactables, room functions,
                adjoining rooms, access control, threat level, or room number. All parameters are optional.
            parameters:
                - name: map
                  in: query
                  schema:
                      type: string
                      example: 'mansionF1'
                  description: Filter by map ID
                - name: item
                  in: query
                  schema:
                      type: string
                      example: 'handgun'
                  description: Filter rooms containing specific item
                - name: biohazard
                  in: query
                  schema:
                      type: string
                      example: 'zombie'
                  description: Filter rooms containing specific biohazard
                - name: person
                  in: query
                  schema:
                      type: string
                      example: 'barryBurton'
                  description: Filter rooms with specific person
                - name: interactable
                  in: query
                  schema:
                      type: string
                      example: 'piano'
                  description: Filter rooms with specific interactable object
                - name: roomFunction
                  in: query
                  schema:
                      type: string
                      example: 'saveRoom'
                  description: Filter by room function (e.g., saveRoom, itemStorage)
                - name: adjoiningRoom
                  in: query
                  schema:
                      type: string
                      example: 'diningRoomF1'
                  description: Filter rooms connected to specific room
                - name: accessControl
                  in: query
                  schema:
                      type: string
                      example: 'shieldKey'
                  description: Filter by required access key
                - name: threatLevel
                  in: query
                  schema:
                      type: integer
                      minimum: 0
                      maximum: 5
                      example: 3
                  description: Filter by threat level (0-5)
                - name: roomNumber
                  in: query
                  schema:
                      type: string
                      example: '101'
                  description: Filter by room number
            responses:
                '200':
                    description: Successful response with filtered rooms
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Room'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimitError'

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
    schemas:
        ItemData:
            type: object
            description: Base item data (master item definition)
            properties:
                id:
                    type: string
                    description: Unique item identifier
                    example: 'typewriter'
                name:
                    type: string
                    description: Display name of the item
                    example: 'Typewriter'
                type:
                    type: string
                    description: Item type/category
                    example: 'Typewriter'
                taxonomy:
                    type: string
                    description: Item taxonomy classification
                    example: 'Key Items'
                function:
                    type: string
                    nullable: true
                    description: Item function description (for Typewriter, ItemBox, Kerosene only)
                    example: 'Save Point'
                imageSrc:
                    type: string
                    description: URL to item image
                    example: 'https://s-media-cache-ak0.pinimg.com/originals/f1/26/57/f126578050920fc271fd8b33534a9605.jpg'
                description:
                    type: string
                    description: Item description
                    example: 'A typewriter that can be used to rudimentarily record progression when providing an Ink Ribbon.'
                exclusive:
                    type: string
                    nullable: true
                    description: Character exclusivity (JV/CR) if applicable
                    example: null

        PersonData:
            type: object
            description: Person data for S.T.A.R.S. team members and characters
            properties:
                id:
                    type: string
                    description: Unique person identifier (PersonID)
                    example: 'jillValentine'
                name:
                    type: string
                    description: Display name of the person (PersonDisplayName)
                    example: 'Jill Valentine'
                type:
                    type: string
                    description: Item type (always PersonOfInterest for persons)
                    example: 'PersonOfInterest'
                    enum: [PersonOfInterest]
                taxonomy:
                    type: string
                    description: Taxonomy classification (always Persons)
                    example: 'Persons'
                    enum: [Persons]
                imageSrc:
                    type: string
                    description: URL to person image
                    example: 'https://placeholder-image-url.jpg'
                bio:
                    type: string
                    description: Biography or description of the person
                    example: 'to be added'
                exclusive:
                    type: string
                    nullable: true
                    description: Character exclusivity (JV for Jill Valentine campaign, CR for Chris Redfield campaign, null if appears in both)
                    example: 'JV'

        BiohazardData:
            type: object
            description: Base biohazard data (master biohazard definition)
            properties:
                id:
                    type: string
                    description: BiohazardCode - unique 2-letter identifier
                    example: 'Zb'
                name:
                    type: string
                    description: Biohazard name
                    example: 'Zombie'
                codeName:
                    type: string
                    nullable: true
                    description: Code name if applicable
                    example: null
                threatLevel:
                    type: string
                    description: Threat level assessment
                    example: 'Low-Moderate'
                starsClassification:
                    type: string
                    description: S.T.A.R.S. classification (Greek letter name)
                    example: 'Zeta'
                starsRanking:
                    type: string
                    description: S.T.A.R.S. ranking number
                    example: '0Half'
                directive:
                    type: string
                    description: Tactical directive
                    example: 'Avoid else Engage'
                prevalence:
                    type: string
                    description: How common this biohazard is
                    example: 'Common'
                imageSrc:
                    type: string
                    description: URL to biohazard image
                    example: 'https://s-media-cache-ak0.pinimg.com/originals/f1/26/57/f126578050920fc271fd8b33534a9605.jpg'
                isVenomous:
                    type: boolean
                    description: Whether the biohazard is venomous
                    example: false
                authorizedResponseProcedures:
                    type: array
                    items:
                        type: string
                    description: Recommended response procedures
                    example: ['Engage from secure distances', 'Avoid close proximity']
                effectiveMeasures:
                    type: string
                    description: Effective weapons and measures
                    example: 'short to long-range small or medium arms, defensive weapons, fire'
                caution:
                    type: string
                    nullable: true
                    description: Caution advisory
                    example: 'Low-Moderate Risk threat level in close proximity with numbers in excess of 2.'
                threats:
                    type: array
                    items:
                        type: object
                        properties:
                            threat:
                                type: string
                            description:
                                type: string
                    description: Specific threats posed
                    example:
                        [
                            {
                                threat: 'Mutation Threat',
                                description: 'Crimson Head mutation, V-ACT (Virus-Activation) secondary infection stage',
                            },
                        ]
                characteristics:
                    type: array
                    items:
                        type: string
                    description: Behavioral characteristics
                    example: ['slow-moving', 'sedate', 'unperceptive']

        ItemRoomData:
            type: object
            description: Item data with room location information
            properties:
                id:
                    type: string
                    description: Unique item instance identifier (format - itemType-roomId)
                    example: 'selfDefenseJV-keepersRoom'
                itemId:
                    type: string
                    description: Reference to ItemData.id
                    example: 'batteryPack'
                name:
                    type: string
                    description: Display name of the item
                    example: 'Battery Pack'
                type:
                    type: string
                    description: Item type/category
                    example: 'SelfDefense'
                qty:
                    type: integer
                    description: Quantity available
                    example: 1
                qtyItems:
                    type: integer
                    nullable: true
                    description: Quantity group identifier
                    example: null
                uses:
                    type: integer
                    nullable: true
                    description: Number of uses for this item
                    example: null
                isFeatured:
                    type: boolean
                    description: Whether this item is featured
                    example: false
                requirement:
                    type: string
                    description: Requirement to obtain item
                    example: 'none'
                map:
                    type: object
                    properties:
                        roomId:
                            type: string
                            example: 'keepersRoom'
                        mapId:
                            type: string
                            example: 'mansionF1'
                difficultyLevel:
                    type: array
                    items:
                        type: string
                        enum:
                            [
                                JV-lvl-very-easy,
                                JV-lvl-easy,
                                JV-lvl-normal,
                                JV-lvl-hard,
                                CR-lvl-very-easy,
                                CR-lvl-easy,
                                CR-lvl-normal,
                                CR-lvl-hard,
                            ]
                    description: Difficulty levels where this item appears
                    example: ['JV-lvl-very-easy', 'JV-lvl-easy', 'JV-lvl-normal', 'JV-lvl-hard']

        BiohazardRoomData:
            type: object
            description: Biohazard (enemy) data with room location information
            properties:
                id:
                    type: string
                    description: Unique biohazard instance identifier (format - biohazardType-roomId)
                    example: 'zombie1-keepersRoom'
                name:
                    type: string
                    description: Biohazard name
                    example: 'Zombie'
                code:
                    type: string
                    description: S.T.A.R.S. BiohazardCode - references BiohazardData.id
                    example: 'Zb'
                qty:
                    type: integer
                    description: Number of enemies
                    example: 1
                ambush:
                    type: boolean
                    nullable: true
                    description: Whether this is an ambush encounter
                    example: false
                isFeatured:
                    type: boolean
                    description: Whether this biohazard is featured
                    example: false
                map:
                    type: object
                    properties:
                        roomId:
                            type: string
                            example: 'keepersRoom'
                        mapId:
                            type: string
                            example: 'mansionF1'
                difficultyLevel:
                    type: array
                    items:
                        type: string
                        enum:
                            [
                                JV-lvl-very-easy,
                                JV-lvl-easy,
                                JV-lvl-normal,
                                JV-lvl-hard,
                                CR-lvl-very-easy,
                                CR-lvl-easy,
                                CR-lvl-normal,
                                CR-lvl-hard,
                            ]
                    description: Difficulty levels where this biohazard appears
                    example:
                        [
                            'JV-lvl-very-easy',
                            'JV-lvl-easy',
                            'JV-lvl-normal',
                            'JV-lvl-hard',
                            'CR-lvl-very-easy',
                            'CR-lvl-easy',
                            'CR-lvl-normal',
                            'CR-lvl-hard',
                        ]

        STARSRanking:
            type: object
            description: S.T.A.R.S. official threat ranking data
            properties:
                code:
                    type: string
                    description: S.T.A.R.S. classification code
                    example: 'Zb'
                starsRanking:
                    type: object
                    description: Detailed S.T.A.R.S. ranking information
                    properties:
                        starsClassification:
                            type: string
                            description: S.T.A.R.S. classification name
                            example: 'Zeta'
                        greeksClassification:
                            type: string
                            description: Greek letter symbol for the classification
                            example: 'ζ'
                        ranking:
                            type: string
                            description: Numerical ranking
                            example: '0Half'
                        threatLevel:
                            type: string
                            description: Threat level assessment
                            example: 'Low-Moderate'
                        directive:
                            type: string
                            description: Recommended tactical directive
                            example: 'Avoid else Engage'

        Area:
            type: object
            description: Game area (major location)
            properties:
                id:
                    type: string
                    description: Unique area identifier
                    example: 'mansion'
                name:
                    type: string
                    description: Area display name
                    example: 'Spencer Mansion'
                description:
                    type: string
                    description: Area description
                    example: 'The main mansion complex'

        Map:
            type: object
            description: Map (floor within an area)
            properties:
                id:
                    type: string
                    description: Unique map identifier
                    example: 'mansionF1'
                name:
                    type: string
                    description: Map display name
                    example: 'Mansion 1F'
                areaId:
                    type: string
                    description: Parent area ID
                    example: 'mansion'
                floor:
                    type: string
                    description: Floor identifier
                    example: '1F'

        Room:
            type: object
            description: Individual room with complete details
            properties:
                id:
                    type: string
                    description: Unique room identifier
                    example: 'keepersRoom'
                name:
                    type: string
                    description: Room display name
                    example: "Keeper's Room"
                roomNumber:
                    type: string
                    description: In-game room number
                    example: '101'
                mapId:
                    type: string
                    description: Parent map ID
                    example: 'mansionF1'
                items:
                    type: array
                    items:
                        type: string
                    description: Item IDs present in this room (format - itemType-roomId)
                    example: ['selfDefenseJV-keepersRoom', 'document-keepersRoom']
                biohazards:
                    type: array
                    items:
                        type: string
                    description: Biohazard IDs present in this room (format - biohazardType-roomId)
                    example: ['zombie1-keepersRoom', 'zombie2-keepersRoom']
                persons:
                    type: array
                    items:
                        type: string
                    description: Person IDs that appear in this room
                    example: ['barryBurton']
                interactables:
                    type: array
                    items:
                        type: string
                    description: Object IDs
                    example: ['typewriter', 'itemBox']
                roomFunction:
                    type: array
                    items:
                        type: string
                    description: Room functions (e.g., saveRoom, itemStorage)
                    example: ['saveRoom']
                adjoiningRooms:
                    type: array
                    items:
                        type: string
                    description: Connected room IDs
                    example: ['diningRoomF1', 'teaRoomCorridor']
                accessControl:
                    type: array
                    items:
                        type: string
                    description: Required keys or items for access
                    example: ['shieldKey']
                threatLevel:
                    type: integer
                    description: Overall threat assessment (0-5)
                    example: 2

        Error:
            type: object
            properties:
                error:
                    type: string
                    description: Error message
                    example: 'Invalid query parameters'
                details:
                    type: array
                    items:
                        type: string
                    description: Detailed error information
                    example: ['ids must be comma-separated alphanumeric strings']

    responses:
        ValidationError:
            description: Invalid request parameters
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        error: 'Invalid query parameters'
                        details: ['ids must be comma-separated alphanumeric strings']

        NotFoundError:
            description: Resource not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        error: 'No IDs provided are recognized'

        RateLimitError:
            description: Rate limit exceeded
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                                example: 'Too many requests, please try again later.'
